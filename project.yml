name: AppleHealthBand
options:
  bundleIdPrefix: com.ninovee
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  AppleHealthBand:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    info:
      path: Generated/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSBluetoothAlwaysUsageDescription: "Apple Health Band uses Bluetooth to connect to your smart band and read its sensors."
        NSBluetoothPeripheralUsageDescription: "Apple Health Band uses Bluetooth to connect to your smart band and read its sensors."
        NSHealthShareUsageDescription: "Apple Health Band reads your existing activity data from Health to show accurate rings and trends."
        NSHealthUpdateUsageDescription: "Apple Health Band writes steps, heart rate, distance, and blood oxygen collected from your band into Health."
        UIBackgroundModes:
          - bluetooth-central
          - healthkit
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.ninovee.applehealthband.sync
    entitlements:
      path: Generated/AppleHealthBand.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ninovee.applehealthband
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    testTargets:
      - AppleHealthBandTests
  AppleHealthBandTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/AppleHealthBandTests
    dependencies:
      - target: AppleHealthBand
schemes:
  AppleHealthBand:
    build:
      targets:
        AppleHealthBand: all
    test:
      targets:
        - AppleHealthBandTests
    run:
      config: Debug
